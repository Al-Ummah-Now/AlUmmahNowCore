# Dependency policy (cargo-deny). Permissive licences only; MPL-2.0 is file-level copyleft and OK.
[graph]
all-features = false

[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD",
  "CDLA-Permissive-2.0", "OpenSSL",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Our own crates are unpublished workspace members.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
