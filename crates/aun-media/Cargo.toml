[package]
name = "aun-media"
description = "Studio media engine (Epic 30): probe/analyse, encode job graph, proxies, transcription, EDL, text shaping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["harfbuzz"]
# Pure-Rust HarfBuzz-compatible text shaping for titles and burned-in captions.
harfbuzz = ["dep:harfrust", "dep:unicode-bidi", "dep:unicode-linebreak", "dep:unicode-script"]
# Real transcription via whisper.cpp. Needs cmake and a C++ toolchain, so it is off by default.
whisper = ["dep:whisper-rs"]
# A reqwest-based ModelFetcher. Off by default; native apps can supply their own fetcher.
http-download = ["dep:reqwest"]

[dependencies]
aun-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
symphonia.workspace = true
ebur128.workspace = true
harfrust = { workspace = true, optional = true }
unicode-bidi = { workspace = true, optional = true }
unicode-linebreak = { workspace = true, optional = true }
unicode-script = { workspace = true, optional = true }
async-trait.workspace = true
sha2.workspace = true
reqwest = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
wiremock.workspace = true
aun-media = { path = ".", features = ["http-download"] }

[lints]
workspace = true
