[package]
name = "aun-upload"
description = "Resumable TUS upload engine for the api-videos TUS proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Folder watching for Studio desktop (19.2). Not built for mobile.
watch = ["dep:notify"]

[dependencies]
aun-common.workspace = true
aun-api.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
base64 = "0.23"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
notify = { version = "8", optional = true, default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
