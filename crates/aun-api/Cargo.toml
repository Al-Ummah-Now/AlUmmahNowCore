[package]
name = "aun-api"
description = "Typed api-videos client: generated operations, retries, auth refresh hook, offline write queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aun-common.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
reqwest = { version = "0.13", default-features = false }
tempfile = "3"

[lints]
workspace = true
