[package]
name = "aun-ffi"
description = "UniFFI bindings for aun-core: the only crate that crosses the FFI boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aun_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]
# On-device transcription (D10) via whisper.cpp: desktop builds turn it on (needs cmake + a C++ toolchain).
whisper = ["aun-media/whisper"]
# The same on the GPU, falling back to the CPU when there is none: Metal (macOS), Vulkan (Windows, Linux).
whisper-metal = ["whisper", "aun-media/whisper-metal"]
whisper-vulkan = ["whisper", "aun-media/whisper-vulkan"]

[dependencies]
aun-common.workspace = true
aun-api.workspace = true
aun-auth.workspace = true
aun-upload.workspace = true
aun-media = { workspace = true, features = ["http-download"] }
aun-search.workspace = true
serde.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false }
uniffi = { workspace = true, features = ["tokio"] }
tokio.workspace = true
thiserror.workspace = true

# Folder watching is a desktop feature (FSEvents/inotify/ReadDirectoryChangesW).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
aun-upload = { workspace = true, features = ["watch"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
