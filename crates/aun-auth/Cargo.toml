[package]
name = "aun-auth"
description = "OAuth 2 + PKCE S256, device authorization (RFC 8628), multi-account, token storage adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aun-common.workspace = true
aun-api.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
