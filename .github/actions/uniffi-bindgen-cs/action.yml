name: Install uniffi-bindgen-cs
description: Installs (and caches) the uniffi-bindgen-cs version matching our pinned uniffi
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      id: cache
      with:
        path: ~/.cargo/bin/uniffi-bindgen-cs${{ runner.os == 'Windows' && '.exe' || '' }}
        key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-v0.11.1+v0.31.0
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install uniffi-bindgen-cs --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.1+v0.31.0
