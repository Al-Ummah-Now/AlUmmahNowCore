name: Install uniffi-bindgen-cs
description: Installs (and caches) the uniffi-bindgen-cs version matching our pinned uniffi
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      id: cache
      with:
        path: ~/.cargo/bin/uniffi-bindgen-cs${{ runner.os == 'Windows' && '.exe' || '' }}
        key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-v0.11.1+v0.31.0
    # Swatinem/rust-cache also caches ~/.cargo/bin under a Cargo.lock-derived key, so the binary can
    # already be there (possibly another version) even when the cache above missed. Plain
    # `cargo install` refuses to overwrite it, so check the installed version and only install,
    # with --force, when it isn't the pinned one.
    - shell: bash
      env:
        PINNED: 0.11.1+v0.31.0
      run: |
        if installed=$(uniffi-bindgen-cs --version 2>/dev/null) && [[ "$installed" == *" $PINNED" ]]; then
          echo "uniffi-bindgen-cs $PINNED already installed"
        else
          echo "installing uniffi-bindgen-cs $PINNED (found: ${installed:-none})"
          cargo install uniffi-bindgen-cs --locked --force \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "v$PINNED"
        fi
        uniffi-bindgen-cs --version
