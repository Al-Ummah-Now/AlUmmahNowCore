# Cross-builds every target and packages the per-platform artifacts.
# Called by ci.yml (validate only) and release.yml (publish: true).
name: build

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the AAR (GitHub Packages Maven) and the NuGet package (GitHub Packages)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  UNIFFI_BINDGEN_CS: v0.11.1+v0.31.0
  # Headers and glslc for whisper.cpp's Vulkan backend on Windows (the loader is opened at run time)
  VULKAN_SDK_VERSION: 1.4.328.1

jobs:
  apple:
    name: apple (iOS, iOS sim, macOS universal, tvOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Nightly for tvOS (tier 3, -Zbuild-std)
        run: rustup toolchain install nightly --profile minimal --component rust-src
      # whisper.cpp's CMake cache stores the compiler's full path; a new runner image (new MSVC/Xcode)
      # must not reuse it (v0.4.0-rc.3: cached MSVC 14.51 path, image had 14.52)
      - id: image
        shell: bash
        run: echo "version=${ImageVersion:-local}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-${{ steps.image.outputs.version }}
      - name: Build XCFramework
        run: scripts/build-xcframework.sh
      - name: Swift smoke test against the XCFramework
        run: AUN_LOCAL_XCFRAMEWORK=1 swift test
      - name: macOS universal dylib (for the NuGet osx runtime)
        # Desktop builds carry on-device transcription (D10, whisper.cpp) on the GPU (Metal), CPU fallback
        run: |
          cargo build -p aun-ffi --lib --release --features whisper-metal --target aarch64-apple-darwin
          cargo build -p aun-ffi --lib --release --features whisper-metal --target x86_64-apple-darwin
          mkdir -p dist/osx
          lipo -create target/aarch64-apple-darwin/release/libaun_core.dylib \
            target/x86_64-apple-darwin/release/libaun_core.dylib -output dist/osx/libaun_core.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: apple-xcframework
          path: |
            build/AunCoreFFI.xcframework.zip
            apple/Sources/AunCore/AunCore.swift
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-osx
          path: dist/osx/libaun_core.dylib
          if-no-files-found: error

  android:
    name: android (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # whisper.cpp's CMake cache stores the compiler's full path; a new runner image (new MSVC/Xcode)
      # must not reuse it (v0.4.0-rc.3: cached MSVC 14.51 path, image had 14.52)
      - id: image
        shell: bash
        run: echo "version=${ImageVersion:-local}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ steps.image.outputs.version }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build .so per ABI
        # The runner image ships an NDK; ANDROID_NDK_LATEST_HOME points at it.
        run: ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}" scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: native-android
          path: bindings/kotlin/aun-core/src/main/jniLibs
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.target }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            rid: win-x64
          - target: aarch64-pc-windows-msvc
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # whisper.cpp's CMake cache stores the compiler's full path; a new runner image (new MSVC/Xcode)
      # must not reuse it (v0.4.0-rc.3: cached MSVC 14.51 path, image had 14.52)
      - id: image
        shell: bash
        run: echo "version=${ImageVersion:-local}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ steps.image.outputs.version }}
      # whisper.cpp's ggml refuses MSVC on ARM64: build that target with clang-cl (LLVM is on the
      # image) through Ninja inside the x64-to-ARM64 MSVC environment
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      # ggml's Vulkan shader generator is a host tool built by its own CMake run, which looks for cl
      # on PATH: the x64 build needs the MSVC developer environment as well
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      # VS 18's STL asks for Clang 22 (STL1000) and the image's clang-cl is older: Microsoft's override.
      # The shader generator runs on the x64 build machine: built with the x64 compiler
      # (.github/cmake/windows-x64-host.cmake), not the ARM64 cross compiler.
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          {
            echo "CMAKE_GENERATOR=Ninja"
            echo "CC_aarch64_pc_windows_msvc=clang-cl"
            echo "CXX_aarch64_pc_windows_msvc=clang-cl"
            echo "CFLAGS_aarch64_pc_windows_msvc=--target=arm64-pc-windows-msvc"
            echo "CXXFLAGS_aarch64_pc_windows_msvc=--target=arm64-pc-windows-msvc /EHsc /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
            echo "GGML_VULKAN_SHADERS_GEN_TOOLCHAIN=$(cygpath -m "$GITHUB_WORKSPACE/.github/cmake/windows-x64-host.cmake")"
          } >> "$GITHUB_ENV"
      - name: Install the Vulkan SDK (headers and glslc)
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vulkansdk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          & "$env:RUNNER_TEMP\vulkansdk.exe" --root $root --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "glslc missing from $root" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$root"
          Add-Content $env:GITHUB_PATH "$root\Bin"
      # Desktop builds carry on-device transcription (D10, whisper.cpp; cmake and MSVC are on the image)
      # on the GPU (Vulkan), CPU fallback
      - run: cargo build -p aun-ffi --lib --release --features whisper-vulkan --target ${{ matrix.target }}
      # The DLL must load where there is no Vulkan loader (no GPU driver, a VM): it opens vulkan-1.dll at
      # run time and never imports it (crates/aun-media/build.rs)
      - name: Check aun_core.dll does not import the Vulkan loader
        shell: pwsh
        run: |
          $imports = & "C:\Program Files\LLVM\bin\llvm-readobj.exe" --coff-imports "target\${{ matrix.target }}\release\aun_core.dll" | Select-String "Name: "
          $imports | ForEach-Object { $_.Line.Trim() }
          if ($imports -match "vulkan") { throw "aun_core.dll imports the Vulkan loader" }
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/aun_core.dll
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            rid: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # whisper.cpp's CMake cache stores the compiler's full path; a new runner image (new MSVC/Xcode)
      # must not reuse it (v0.4.0-rc.3: cached MSVC 14.51 path, image had 14.52)
      - id: image
        shell: bash
        run: echo "version=${ImageVersion:-local}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ steps.image.outputs.version }}
      - name: Install build tools for whisper.cpp
        uses: ./.github/actions/apt-install
        with:
          packages: cmake clang libclang-dev
      # Ubuntu 22.04 has no glslc and old Vulkan headers, and LunarG ships no Linux arm64 SDK:
      # conda-forge builds both (against an old glibc) for x86_64 and arm64
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: vulkan
          create-args: -c conda-forge shaderc vulkan-headers libvulkan-loader
          cache-environment: true
      - name: Point the build at the Vulkan headers and glslc
        run: |
          test -x "$MAMBA_ROOT_PREFIX/envs/vulkan/bin/glslc"
          echo "VULKAN_SDK=$MAMBA_ROOT_PREFIX/envs/vulkan" >> "$GITHUB_ENV"
      # Built on 22.04 so the .so links against an older glibc (2.35) and runs on more distros.
      # Desktop builds carry on-device transcription (D10, whisper.cpp) on the GPU (Vulkan), CPU fallback.
      - run: cargo build -p aun-ffi --lib --release --features whisper-vulkan --target ${{ matrix.target }}
      # The .so must load where there is no libvulkan: it opens libvulkan.so.1 at run time and never
      # links it (crates/aun-media/build.rs)
      - name: Check libaun_core.so does not need the Vulkan loader
        run: |
          readelf -d target/${{ matrix.target }}/release/libaun_core.so | grep NEEDED
          ! readelf -d target/${{ matrix.target }}/release/libaun_core.so | grep NEEDED | grep -i vulkan
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/libaun_core.so
          if-no-files-found: error

  bindings:
    name: generate Kotlin + C# sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # whisper.cpp's CMake cache stores the compiler's full path; a new runner image (new MSVC/Xcode)
      # must not reuse it (v0.4.0-rc.3: cached MSVC 14.51 path, image had 14.52)
      - id: image
        shell: bash
        run: echo "version=${ImageVersion:-local}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings-${{ steps.image.outputs.version }}
      - uses: ./.github/actions/uniffi-bindgen-cs
      - run: scripts/gen-bindings.sh kotlin --release && scripts/gen-bindings.sh csharp --release
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-sources
          path: |
            bindings/kotlin/generated
            bindings/csharp/generated
          if-no-files-found: error

  aar:
    name: package AAR
    needs: [android, bindings]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-android
          path: bindings/kotlin/aun-core/src/main/jniLibs
      - uses: actions/download-artifact@v8
        with:
          name: bindings-sources
          path: bindings
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble AAR
        working-directory: bindings/kotlin
        run: ./gradlew --no-daemon :aun-core:assembleRelease
      - name: Check the AAR carries every ABI
        run: |
          unzip -l bindings/kotlin/aun-core/build/outputs/aar/aun-core-release.aar | tee /tmp/aar.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do grep -q "jni/$abi/libaun_core.so" /tmp/aar.txt; done
      - uses: actions/upload-artifact@v7
        with:
          name: android-aar
          path: bindings/kotlin/aun-core/build/outputs/aar/aun-core-release.aar
          if-no-files-found: error
      - name: Publish to GitHub Packages Maven
        if: inputs.publish
        working-directory: bindings/kotlin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :aun-core:publishReleasePublicationToGitHubPackagesRepository

  nuget:
    name: package NuGet
    needs: [apple, windows, linux, bindings]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bindings-sources
          path: bindings
      - name: Stage native runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: staging
      - run: |
          set -euo pipefail
          R=bindings/csharp/AlUmmahNow.Core/runtimes
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx; do
            mkdir -p "$R/$rid/native" && cp staging/native-$rid/* "$R/$rid/native/"
          done
          find "$R" -type f
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Pack
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          dotnet pack bindings/csharp/AlUmmahNow.Core -c Release -p:AunCoreVersion=$VERSION -o dist
          unzip -l dist/*.nupkg | grep runtimes/
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: dist/*.nupkg
          if-no-files-found: error
      - name: Publish to GitHub Packages NuGet
        if: inputs.publish
        run: >
          dotnet nuget push "dist/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
